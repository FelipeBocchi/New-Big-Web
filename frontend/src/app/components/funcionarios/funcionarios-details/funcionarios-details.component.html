<div
  class="modal-overlay"
  *ngIf="modalAberto"
  (click)="fecharModal()"
>

  <div
    class="funcionarios-modal"
    (click)="$event.stopPropagation()"
  >

    <div class="modal-header">

      <h2>
        {{ modoEdicao ? 'Editar Funcionário' : 'Novo Funcionário' }}
      </h2>

      <button
        class="btn-fechar"
        (click)="fecharModal()"
      >
        ×
      </button>

    </div>


    <div class="modal-body">

      <div class="campo">

        <label>Nome</label>

        <input
          type="text"
          [(ngModel)]="funcionario.name"
          placeholder="Digite o nome"
        >

      </div>

      <div class="campo">
          <label>CPF</label>
          <input
            type="text"
            [(ngModel)]="funcionario.cpf"
            placeholder="Digite o CPF"
          >
        </div>

      <div class="campo">

        <label>E-mail</label>

        <input
          type="text"
          [(ngModel)]="funcionario.email"
          placeholder="Digite o e-mail"
        >

      </div>


      <div class="campo">

        <label>Telefone</label>

        <input
          type="text"
          [(ngModel)]="funcionario.phone"
          placeholder="Digite o telefone"
        >

      </div>


      <div class="campo">
  <label>Cargo</label>

  <select [(ngModel)]="funcionario.role">
    <option value="">Selecione um cargo</option>
    <option value="ATTENDANT">Atendente</option>
    <option value="CASHIER">Caixa</option>
    <option value="STOCK_CLERK">Estoquista</option>
    <option value="MANAGER">Gerente</option>
  </select>
</div>

        <div class="campo">
          <label>Usuário</label>
          <input
            type="text"
            [(ngModel)]="funcionario.username"
            placeholder="Digite o usuário"
          >
        </div>

        <div class="campo">
          <label>Senha</label>
          <input
            type="password"
            [(ngModel)]="funcionario.password"
            placeholder="Digite a senha"
          >
        </div>

        <div class="campo">
          <label>Data de nascimento</label>
          <input
            type="date"
            [(ngModel)]="funcionario.birthDate"
          >
        </div>

        <div class="campo">
          <label>Administrador</label>
          <select [(ngModel)]="funcionario.admin">
            <option [ngValue]="false">Não</option>
            <option [ngValue]="true">Sim</option>
          </select>
        </div>

    </div>


    <div class="modal-footer">

      <button
        class="btn-cancelar"
        (click)="fecharModal()"
      >
        Cancelar
      </button>

      <button
        class="btn-salvar"
        (click)="save()"
      >
        Salvar
      </button>

    </div>

  </div>

</div>
