<div class="sidebar" (keydown.escape)="closeMenu(menuToggle)">
  <div class="sidebar__header">
    <img
      class="sidebar__logo"
      src="assets/logo_newbig.png"
      alt="New Big Sorveteria"
      width="152"
      height="152"
    >

    <button
      #menuToggle
      type="button"
      class="sidebar__toggle"
      aria-controls="main-navigation"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuOpen.set(!menuOpen())"
    >
      <i class="fa-solid" [class.fa-bars]="!menuOpen()" [class.fa-xmark]="menuOpen()" aria-hidden="true"></i>
      Menu
    </button>
  </div>

  <nav
    id="main-navigation"
    class="sidebar__navigation"
    aria-label="Navegação principal"
    [class.sidebar__navigation--open]="menuOpen()"
  >
    <ul class="sidebar__list">
      @for (link of links; track link.label) {
        <li>
          @if (link.route; as route) {
            <a
              class="sidebar__link"
              [routerLink]="route"
              routerLinkActive="sidebar__link--active"
              ariaCurrentWhenActive="page"
              (click)="closeMenu(menuToggle)"
            >
              {{ link.label }}
            </a>
          } @else {
            <span
              class="sidebar__link sidebar__link--disabled"
              role="link"
              aria-disabled="true"
              title="Dashboard indisponível"
            >
              {{ link.label }}
            </span>
          }
        </li>
      }
    </ul>
  </nav>
</div>
