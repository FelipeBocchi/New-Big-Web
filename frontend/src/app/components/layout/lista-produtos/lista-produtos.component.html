<div class="content-wrapper">
  <!-- Topo: Busca + Botão -->
  <header class="top-bar">
    <div class="search-box">
      <input 
        type="text" 
        placeholder="Buscar Produto..." 
        [ngModel]="termoBusca()" 
        (ngModelChange)="termoBusca.set($event)"
      />
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </div>

    <button class="btn-novo" (click)="abrirModal()">Novo produto</button>
  </header>

  <!-- Tabela com Borda Azul -->
  <div class="table-card">
    <table class="products-table">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Codigo de barras</th>
          <th>Categoria</th>
          <th>Preço</th>
          <th>Status</th>
          <th class="text-end">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let prod of produtosFiltrados()">
          <td class="fw-medium">{{ prod.name }}</td>
          <td class="text-secondary">{{ prod.barCode || '—' }}</td>
          <td class="text-secondary">{{ prod.category || '—' }}</td>
          <td class="fw-medium">R${{ prod.salePrice ? prod.salePrice.toFixed(2).replace('.', ',') : '0,00' }}</td>
          <td>
            <span class="badge" [ngClass]="prod.status === 'Ativo' ? 'badge-ativo' : 'badge-inativo'">
              <span class="dot"></span>
              {{ prod.status || 'Ativo' }}
            </span>
          </td>
          <td>
            <div class="d-flex justify-content-end gap-2">
              <button class="btn-action btn-delete" (click)="excluirProduto(prod.id)" title="Excluir">
                🗑️
              </button>
              <button class="btn-action btn-edit" title="Editar">
                ✏️
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Paginação -->
  <footer class="pagination">
    <button class="page-btn">&lt;</button>
    <button class="page-btn active">1</button>
    <button class="page-btn">2</button>
    <button class="page-btn">3</button>
    <button class="page-btn">&gt;</button>
  </footer>

</div>

<!-- Modal de Cadastro de Produto -->
<div class="modal-backdrop" *ngIf="showModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Cadastrar Novo Produto</h5>
        <button type="button" class="btn-close" (click)="fecharModal()">✕</button>
      </div>
      
      <form (ngSubmit)="salvarProduto()">
        <div class="modal-body">
          <div class="form-group mb-3">
            <label>Nome do Produto</label>
            <input type="text" class="form-control" [(ngModel)]="novoProduto.name" name="name" required />
          </div>

          <div class="form-group mb-3">
            <label>Código de Barras</label>
            <input type="text" class="form-control" [(ngModel)]="novoProduto.barCode" name="barCode" />
          </div>

          <div class="form-group mb-3">
            <label>Categoria</label>
            <input type="text" class="form-control" [(ngModel)]="novoProduto.category" name="category" />
          </div>

          <div class="form-group mb-3">
            <label>Preço de Venda (R$)</label>
            <input type="number" step="0.01" class="form-control" [(ngModel)]="novoProduto.salePrice" name="salePrice" required />
          </div>

          <div class="form-group mb-3">
            <label>Status</label>
            <select class="form-control" [(ngModel)]="novoProduto.status" name="status">
              <option value="Ativo">Ativo</option>
              <option value="Inativo">Inativo</option>
            </select>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="fecharModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar Produto</button>
        </div>
      </form>
    </div>
  </div>
</div>
