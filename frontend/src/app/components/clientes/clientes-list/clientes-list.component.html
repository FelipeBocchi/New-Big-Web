<div class="clientes-container">

  <div class="cabecalho">
    <h1>Clientes</h1>

    <div class="acoes-topo">
      <div class="campo-busca">
        <input type="text" placeholder="Buscar Cliente..." [(ngModel)]="termoBusca" />
        <span class="icone-busca"><i class="fas fa-magnifying-glass"></i></span>
      </div>

      <button class="btn-novo" (click)="novoCliente()">
        <span>+</span> Novo Cliente
      </button>
    </div>
  </div>

  <div class="tabela-container">
    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>E-mail</th>
          <th>Telefone</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cliente of clientesFiltrados">
          <td>
            <div class="avatar-info">
              <div class="avatar">
                {{ cliente.name ? cliente.name.charAt(0).toUpperCase() : 'C' }}
              </div>
              <div class="nome-container">
                <span class="nome">{{ cliente.name || 'Sem nome' }}</span>
                <span class="id" *ngIf="cliente.cpf">CPF: {{ cliente.cpf }}</span>
              </div>
            </div>
          </td>

          <td>{{ cliente.email }}</td>
          <td>{{ cliente.phone }}</td>

          <td>
            <span class="status" [class.ativo]="cliente.active" [class.inativo]="!cliente.active">
              <i class="fas fa-circle"></i>
              {{ cliente.active ? 'Ativo' : 'Inativo' }}
            </span>
          </td>

          <td>
            <div class="acoes">
              <button class="btn-status" [class.active]="cliente.active" [class.inativo]="!cliente.active"
                (click)="alterarStatus(cliente)" [title]="cliente.active ? 'Desativar cliente' : 'Ativar cliente'">
                <i class="fas fa-circle"></i>
              </button>

              <button class="btn-editar" (click)="editarCliente(cliente)" title="Editar">
                <i class="fas fa-pen"></i>
              </button>

             
            </div>
          </td>
        </tr>
        <tr *ngIf="clientesFiltrados.length === 0">
          <td colspan="5" style="text-align: center; padding: 20px;">Nenhum cliente encontrado.</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<!-- Componente Modal Customizado -->
<app-clientes-details 
  [modalAberto]="modalAberto" 
  [modoEdicao]="modoEdicao" 
  [cliente]="editCliente"
  (fechar)="fecharModal()" 
  (salvarCliente)="retornoDetails($event)">
</app-clientes-details>
